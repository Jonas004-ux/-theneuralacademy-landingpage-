<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Inter:wght@400;600&display=swap">
  <style>
    body { margin: 0; }
    .page {
      width: 420px;
      box-sizing: border-box;
      padding: 40px;
      background: #F5FAF7;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #16231C;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #1E9E5C;
      margin: 0 0 6px;
    }
    .headline {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
      color: #16231C;
    }
    .rationale {
      font-size: 13px;
      line-height: 1.5;
      color: #46524C;
      margin: 0;
      max-width: 42ch;
    }
    .card {
      border-radius: 18px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(22,35,28,0.07), 0 1px 3px rgba(22,35,28,0.04);
    }
    .card-label { font-size: 12px; color: #66716B; font-family: 'Inter', sans-serif; }
    .row { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .size-frame { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    a { color: #16231C; }
    a:hover { color: #1E9E5C; }
  </style>
</helmet>

<div class="page">

  <div>
    <p class="eyebrow">Richtung A</p>
    <h1 class="headline">Wissensnetz</h1>
    <p class="rationale">Vier Quellen laufen in einem Knoten zusammen. Der grüne Knoten ist der Moment, in dem Material zu Verständnis wird, dieselbe Farbdisziplin wie im Rest der Marke: Grün nur an der einen Stelle, die zählt.</p>
  </div>

  <div class="card" style="background:#16231C;">
    <svg width="180" height="180" viewBox="0 0 200 200">
      <rect x="10" y="10" width="180" height="180" rx="40" fill="#16231C"></rect>
      <line x1="66" y1="62" x2="102" y2="98" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></line>
      <line x1="136" y1="54" x2="102" y2="98" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></line>
      <line x1="58" y1="132" x2="102" y2="98" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></line>
      <line x1="126" y1="140" x2="102" y2="98" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></line>
      <circle cx="66" cy="62" r="11" fill="#FFFFFF"></circle>
      <circle cx="136" cy="54" r="11" fill="#FFFFFF"></circle>
      <circle cx="58" cy="132" r="11" fill="#FFFFFF"></circle>
      <circle cx="126" cy="140" r="11" fill="#FFFFFF"></circle>
      <circle cx="102" cy="98" r="16" fill="{{accent}}"></circle>
    </svg>
    <span class="card-label" style="color:#9CA6A0;">Primär, auf Hell</span>
  </div>

  <div class="card" style="background:#FFFFFF;">
    <svg width="180" height="180" viewBox="0 0 200 200">
      <rect x="10" y="10" width="180" height="180" rx="40" fill="#FFFFFF"></rect>
      <line x1="66" y1="62" x2="102" y2="98" stroke="#16231C" stroke-width="7" stroke-linecap="round"></line>
      <line x1="136" y1="54" x2="102" y2="98" stroke="#16231C" stroke-width="7" stroke-linecap="round"></line>
      <line x1="58" y1="132" x2="102" y2="98" stroke="#16231C" stroke-width="7" stroke-linecap="round"></line>
      <line x1="126" y1="140" x2="102" y2="98" stroke="#16231C" stroke-width="7" stroke-linecap="round"></line>
      <circle cx="66" cy="62" r="11" fill="#16231C"></circle>
      <circle cx="136" cy="54" r="11" fill="#16231C"></circle>
      <circle cx="58" cy="132" r="11" fill="#16231C"></circle>
      <circle cx="126" cy="140" r="11" fill="#16231C"></circle>
      <circle cx="102" cy="98" r="16" fill="{{accent}}"></circle>
    </svg>
    <span class="card-label">Reversed, auf Dunkel</span>
  </div>

  <div>
    <div class="row" style="background:#FFFFFF; border-radius:18px; padding:20px;">
      <div class="size-frame">
        <svg width="64" height="64" viewBox="0 0 200 200">
          <rect x="10" y="10" width="180" height="180" rx="40" fill="#16231C"></rect>
          <line x1="66" y1="62" x2="102" y2="98" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></line>
          <line x1="136" y1="54" x2="102" y2="98" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></line>
          <line x1="58" y1="132" x2="102" y2="98" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></line>
          <line x1="126" y1="140" x2="102" y2="98" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"></line>
          <circle cx="66" cy="62" r="12" fill="#FFFFFF"></circle>
          <circle cx="136" cy="54" r="12" fill="#FFFFFF"></circle>
          <circle cx="58" cy="132" r="12" fill="#FFFFFF"></circle>
          <circle cx="126" cy="140" r="12" fill="#FFFFFF"></circle>
          <circle cx="102" cy="98" r="18" fill="{{accent}}"></circle>
        </svg>
        <span class="card-label">64px</span>
      </div>
      <div class="size-frame">
        <svg width="32" height="32" viewBox="0 0 200 200">
          <rect x="10" y="10" width="180" height="180" rx="40" fill="#16231C"></rect>
          <line x1="64" y1="60" x2="102" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"></line>
          <line x1="138" y1="52" x2="102" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"></line>
          <line x1="56" y1="134" x2="102" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"></line>
          <line x1="128" y1="142" x2="102" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"></line>
          <circle cx="64" cy="60" r="14" fill="#FFFFFF"></circle>
          <circle cx="138" cy="52" r="14" fill="#FFFFFF"></circle>
          <circle cx="56" cy="134" r="14" fill="#FFFFFF"></circle>
          <circle cx="128" cy="142" r="14" fill="#FFFFFF"></circle>
          <circle cx="102" cy="98" r="20" fill="{{accent}}"></circle>
        </svg>
        <span class="card-label">32px</span>
      </div>
      <div class="size-frame">
        <svg width="16" height="16" viewBox="0 0 200 200">
          <rect x="10" y="10" width="180" height="180" rx="40" fill="#16231C"></rect>
          <line x1="62" y1="58" x2="102" y2="98" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></line>
          <line x1="140" y1="50" x2="102" y2="98" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></line>
          <line x1="54" y1="136" x2="102" y2="98" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></line>
          <line x1="130" y1="144" x2="102" y2="98" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></line>
          <circle cx="62" cy="58" r="16" fill="#FFFFFF"></circle>
          <circle cx="140" cy="50" r="16" fill="#FFFFFF"></circle>
          <circle cx="54" cy="136" r="16" fill="#FFFFFF"></circle>
          <circle cx="130" cy="144" r="16" fill="#FFFFFF"></circle>
          <circle cx="102" cy="98" r="22" fill="{{accent}}"></circle>
        </svg>
        <span class="card-label">16px</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1E9E5C","options":["#1E9E5C","#17824B","#34C67F"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1E9E5C' };
  }
}
</script>
</body>
</html>
